<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shalom Reels — Vídeos Cinematográficos</title>
<link rel="icon" type="image/png" href="logo-icon.png" />
<!-- ?v= é uma quebra de cache manual: aumente o número sempre que
     styles.css/app.js mudar, senão navegadores continuam usando a
     versão antiga em cache mesmo depois do deploy. -->
<link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img src="logo-icon.png" alt="Shalom" class="brand-icon" />
    <span class="brand-text">SHALOM <span class="brand-text-sub">Reels</span></span>
  </div>
  <div id="userBox" class="user-box hidden">
    <span id="userEmail"></span>
    <button id="logoutBtn" class="btn btn-ghost">Sair</button>
  </div>
</header>

<main class="container">

  <!-- ---------- AUTENTICAÇÃO ---------- -->
  <section id="authSection" class="card auth-card">
    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Entrar</button>
      <button class="tab-btn" data-tab="register">Criar conta</button>
    </div>

    <form id="loginForm" class="tab-panel active">
      <label>E-mail
        <input type="email" name="email" required autocomplete="email" />
      </label>
      <label>Senha
        <input type="password" name="password" required autocomplete="current-password" />
      </label>
      <button type="submit" class="btn btn-primary">Entrar</button>
      <p class="form-error" data-for="loginForm"></p>
      <button type="button" id="forgotPasswordBtn" class="link-btn">Esqueci minha senha</button>
      <p id="forgotPasswordMsg" class="hint hidden"></p>
    </form>

    <form id="registerForm" class="tab-panel">
      <label>Nome
        <input type="text" name="full_name" autocomplete="name" />
      </label>
      <label>E-mail
        <input type="email" name="email" required autocomplete="email" />
      </label>
      <label>Senha (mín. 8 caracteres)
        <input type="password" name="password" required minlength="8" autocomplete="new-password" />
      </label>
      <button type="submit" class="btn btn-primary">Criar conta</button>
      <p class="form-error" data-for="registerForm"></p>
    </form>
  </section>

  <!-- ---------- APP (logado) ---------- -->
  <section id="appSection" class="hidden">

    <div class="card">
      <div class="usage-row">
        <h2>Novo vídeo</h2>
        <span id="usageBadge" class="badge">-- / -- hoje</span>
      </div>

      <form id="uploadForm">
        <label>Fotos do imóvel (até 20 fotos, 15MB cada)
          <input type="file" id="photosInput" name="photos" accept="image/jpeg,image/png,image/webp" multiple />
        </label>
        <p id="photoHint" class="hint hidden">Arraste as fotos (ou use as setas) para definir a ordem no vídeo.</p>
        <div id="photoPreview" class="photo-preview"></div>

        <label>Estilo do vídeo
          <select name="style" id="styleSelect">
            <option value="classico">Clássico — elegante, cores quentes, zoom suave</option>
            <option value="moderno">Moderno — dinâmico, contraste alto, transições rápidas</option>
            <option value="suave">Suave — sutil, tons pastel, ritmo calmo</option>
          </select>
        </label>

        <button type="submit" class="btn btn-primary" id="submitBtn">Gerar vídeo</button>
        <p class="form-error" data-for="uploadForm"></p>
      </form>
    </div>

    <div class="card">
      <div class="usage-row">
        <h2>Meus vídeos</h2>
        <button id="refreshBtn" class="btn btn-ghost">Atualizar</button>
      </div>
      <div id="jobsList" class="jobs-list">
        <p class="empty-state">Nenhum vídeo gerado ainda.</p>
      </div>
    </div>

  </section>

</main>

<footer class="footer">
  <p>Shalom Consultoria Imobiliária — geração de vídeos</p>
</footer>

<script src="config.js"></script>
<script src="app.js?v=3"></script>
</body>
</html>
